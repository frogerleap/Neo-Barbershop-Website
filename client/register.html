<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Neo Brutalism Barbershop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">NEO BARBERSHOP</a>
    </nav>

    <section class="auth-page">
        <div class="auth-container">
            <a href="login.html" class="back-link">← Back to Login</a>
            <h1>Create Account</h1>
            
            <form action="#" onsubmit="event.preventDefault(); loginDummy(document.getElementById('name').value, document.getElementById('email').value, document.getElementById('phone').value)">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="submit-btn">Sign Up</button>
            </form>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
